<html>
	<head>
	    <meta charset="UTF-8" />
	    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
	    <script
	      type="module"
	      src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
	    <title>Модель</title>
	</head>
	<body>
		<h1>Тест AR</h1>
		<model-viewer
				id="model"
				alt="3D Model"
				src="./assets/model/Horse_animation.gltf"
				camera-controls
				ar
				ar-modes="webxr scene-viewer quick-look"
				autoplay
			>
				<button slot="ar-button" id="ar-button">Посмотреть в ar</button>
				<button slot="exit-webxr-ar-button" id="exit-btn-1">Z</button>

				  <div id="ar-prompt">
    					HELLO WORLD! HELLO WORLD!
  					</div>
			</model-viewer>
	</body>
</html>

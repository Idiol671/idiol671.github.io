<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Важные meta-теги для AR -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent" />

    <!-- Подключаем model-viewer заранее для лучшей производительности -->
    <script
      type="module"
      src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  </head>
  <!-- Добавляем data-атрибуты с именами файлов моделей -->
  <body data-usdz="Horse_animation.usdz" data-gltf="Horse_animation.glb">
    <main class="main">
      <div class="fill">
        <!-- Скрываем по умолчанию, показываем только если нужно -->
        <model-viewer
          camera-controls
          ar
          ar-modes="scene-viewer webxr quick-look"
          autoplay
          id="model"
          alt="3D Model"
          src="/assets/models/Horse_animation.glb"
          enable-pan
          style="display: none; width: 100%; height: 100vh">
        </model-viewer>
      </div>
    </main>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        // Получаем существующий элемент model-viewer
        const existingViewer = document.getElementById("model");

        // Определение ОС
        const userAgent =
          navigator.userAgent || navigator.vendor || window.opera;

        // Определяем iOS
        const isIos = /iPad|iPhone|iPod/.test(userAgent) && !window.MSStream;

        // Определяем Android (более точное определение)
        const isAndroid = /android/i.test(userAgent) && !window.MSStream;

        // Получаем данные из data-атрибутов body
        const usdzModel = document.body.dataset.usdz;
        const gltfModel = document.body.dataset.gltf;

        // Проверяем поддержку AR в целом
        const isArSupported =
          "xr" in navigator ||
          (document.createElement("a").relList &&
            document.createElement("a").relList.supports("ar"));

        console.log("Platform detection:", {
          isIos,
          isAndroid,
          userAgent: userAgent.substring(0, 100),
          isArSupported,
          hasUsdz: !!usdzModel,
          hasGltf: !!gltfModel,
        });

        // Функция для показа существующего model-viewer
        function showExistingViewer() {
          if (existingViewer) {
            console.log("Showing existing model-viewer");
            existingViewer.style.display = "block";

            // Обновляем src если нужно
            if (
              gltfModel &&
              existingViewer.getAttribute("src") !==
                "assets/models/" + gltfModel
            ) {
              existingViewer.setAttribute("src", "assets/models/" + gltfModel);
            }
          } else {
            console.error("No existing model-viewer element found");
          }
        }

        // Функция для открытия AR на iOS
        function openIosAr() {
          if (!usdzModel) {
            console.warn("No USDZ model specified for iOS AR");
            showExistingViewer();
            return;
          }

          const url = "assets/models/" + usdzModel;
          console.log("Opening iOS AR with URL:", url);

          const a = document.createElement("a");
          a.href = url;
          a.style.display = "none";

          // Проверяем поддержку AR Quick Look
          let supportsAR = false;
          try {
            supportsAR =
              a.relList && a.relList.supports && a.relList.supports("ar");
          } catch (e) {
            console.log("AR support check failed:", e);
          }

          if (supportsAR) {
            a.rel = "ar";

            // Добавляем миниатюру для AR
            const img = document.createElement("img");
            img.src =
              "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8/5+hHgAHggJ/PchI7wAAAABJRU5ErkJggg==";
            img.style.display = "none";
            a.appendChild(img);

            document.body.appendChild(a);

            // Пытаемся открыть AR
            a.click();

            // Если через 500мс ссылка еще на странице, AR не открылся
            setTimeout(() => {
              if (document.body.contains(a)) {
                console.log("iOS AR Quick Look failed or cancelled");
                document.body.removeChild(a);
                showExistingViewer();
              }
            }, 500);
          } else {
            console.log("AR Quick Look not supported on this iOS device");
            showExistingViewer();
          }
        }

        // Функция для открытия AR на Android
        function openAndroidAr() {
          if (!gltfModel) {
            console.warn("No GLTF model specified for Android AR");
            showExistingViewer();
            return;
          }

          // Проверяем, не находимся ли мы уже в fallback режиме
          const urlParams = new URLSearchParams(window.location.search);
          const hasFallback = urlParams.get("fallback") !== null;

          if (hasFallback) {
            console.log("Already in fallback mode, showing model-viewer");
            showExistingViewer();
            return;
          }

          // Создаем URL для модели
          const baseUrl =
            window.location.origin +
            window.location.pathname.substring(
              0,
              window.location.pathname.lastIndexOf("/") + 1
            );
          const modelUrl =
            baseUrl + "assets/models/" + encodeURIComponent(gltfModel);

          // Создаем Intent URL для Google Scene Viewer
          const intentUrl =
            "intent://arvr.google.com/scene-viewer/1.0?" +
            "file=" +
            encodeURIComponent(modelUrl) +
            "&mode=ar_only" +
            "#Intent;" +
            "scheme=https;" +
            "package=com.google.ar.core;" +
            "action=android.intent.action.VIEW;" +
            "S.browser_fallback_url=" +
            encodeURIComponent(window.location.href + "?fallback=true") +
            ";" +
            "end;";

          console.log("Opening Android AR with URL:", intentUrl);

          // Пытаемся открыть Scene Viewer
          window.location.replace(intentUrl);

          // Fallback таймер
          setTimeout(() => {
            if (!window.location.href.includes("fallback=true")) {
              console.log("Scene Viewer not available, falling back");
              showExistingViewer();
            }
          }, 1000);
        }

        // Основная логика
        if (isIos) {
          console.log("iOS device detected");
          openIosAr();
        } else if (isAndroid) {
          console.log("Android device detected");
          openAndroidAr();
        } else {
          // Для десктопов и других устройств
          console.log("Non-mobile device detected, showing model-viewer");
          showExistingViewer();
        }

        // Также показываем model-viewer если пользователь явно хочет (например, кнопка "Показать в браузере")
        window.showInBrowser = function () {
          showExistingViewer();
        };
      });
    </script>

    <style>
      /* Скрываем по умолчанию, показываем через JS */
      model-viewer {
        width: 100%;
        height: 100vh;
        display: none;
      }

      /* Стиль для кнопки fallback (опционально) */
      .fallback-button {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        padding: 12px 24px;
        background: #4285f4;
        color: white;
        border: none;
        border-radius: 24px;
        font-size: 16px;
        cursor: pointer;
        z-index: 1000;
        display: none;
      }
    </style>

    <!-- Опциональная кнопка для ручного fallback -->
    <button class="fallback-button" onclick="window.showInBrowser()">
      View in Browser
    </button>
  </body>
</html>
